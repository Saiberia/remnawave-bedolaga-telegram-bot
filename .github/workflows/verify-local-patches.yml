name: verify local patches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify LOCAL patches
        run: python3 scripts/verify_local_patches.py

      - name: Syntax-check changed Python files
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$changed" ]; then
            for f in $changed; do
              if [ -f "$f" ]; then
                python3 -c "import ast, sys; ast.parse(open('$f').read()); print('ok: $f')"
              fi
            done
          fi
